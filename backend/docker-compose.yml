services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vertex-saas-backend
    user: "0:0"
    restart: unless-stopped
    ports:
      - "80:5000"
      - "5000:5000"
      - "4000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - BACKEND_URL=https://api.vertext.online
      - FRONTEND_URL=https://vertext.online
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
