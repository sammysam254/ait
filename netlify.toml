[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

# ─── SPA ROUTING ──────────────────────────────────────────────────────────────
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--include=dev"
  VITE_API_URL = "https://api.vertext.online/api"
  VITE_WS_HOST = "api.vertext.online"
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "PORT,NODE_ENV,CLOUDFLARE_SUBDOMAIN,CLOUDFLARE_DOMAIN,FRONTEND_URL,BACKEND_URL,SUPABASE_ANON_KEY,SUPABASE_URL"

# ─── SECURITY HEADERS ─────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent clickjacking
    X-Frame-Options = "DENY"
    # Prevent MIME-type sniffing
    X-Content-Type-Options = "nosniff"
    # XSS protection for older browsers
    X-XSS-Protection = "1; mode=block"
    # Referrer info only sent on same-origin
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Restrict browser features (allow payment for Paystack)
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Force HTTPS for 1 year
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Content Security Policy — allow our API, WebSockets, Supabase, Paystack checkout iframe, AudioWorklet blob:, Google Fonts, Cloudflare
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://*.paystack.co https://*.paystack.com https://static.cloudflareinsights.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://*.paystack.co https://*.paystack.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://api.vertext.online wss://api.vertext.online https://*.vertext.online wss://*.vertext.online https://*.paystack.co https://*.paystack.com https://*.supabase.co wss://*.supabase.co https://fonts.googleapis.com; media-src 'self' blob:; frame-src 'self' https://*.paystack.co https://*.paystack.com; child-src 'self' https://*.paystack.co https://*.paystack.com; object-src 'none'; base-uri 'self';"

# ─── CACHE STATIC ASSETS ──────────────────────────────────────────────────────
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML: no cache (always fresh for SPA routing)
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
