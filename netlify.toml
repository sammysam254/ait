[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--include=dev"
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "PORT,NODE_ENV,CLOUDFLARE_SUBDOMAIN,CLOUDFLARE_DOMAIN,FRONTEND_URL,BACKEND_URL,SUPABASE_ANON_KEY,SUPABASE_URL"
